<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Mobile Banking App</title>
    
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-slate-800">
    
    <section class="max-w-md min-h-screen mx-auto bg-gray-200 py-6">
        <header>
            <nav>
                <div class=" mt-20 flex justify-center items-center ">
                    <img class="w-72 absolute" src="./assets/bg.png" alt="">
                    <img class="mb-32 w-20" src="./assets/Group.png" alt="">
                </div>
            </nav>
        </header>


    <form class="-mt-28 bg-gray-200 w-full">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label" >Account Number</label>
          <input type="number" id="account-number" class="input" placeholder="Account Number" required/>
          <label class="label">Pin</label>
          <input type="text" id="pin" class="input" placeholder="Enter Your Pin" required/>
          <div><a class="link link-hover">Forgot password?</a></div>
          <button id="login-btn" class="btn rounded-full shadow-none bg-blue-600 text-white bold mt-4">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
    </form>
    </section>

    <script src="./script/login.js"></script>
</body>
</html>
